<title>PaymentOS — The operating system for corporate money</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* PaymentOS — neutral institutional palette. Blue is an accent only, never a surface. Bare :root = light. */
  :root{
    --ground:#F6F7F8; --surface:#FFFFFF; --surface-2:#F1F2F4; --sunken:#EDEEF0;
    --ink:#17181B; --ink-2:#3F424A; --ink-3:#6C7079; --ink-4:#9AA0A8;
    --rule:#E4E5E8; --rule-2:#D4D6DA;
    --accent:#2F55D4; --accent-ink:#2242B8; --accent-soft:#EEF0F5; --accent-line:#D9DCE4; --on-accent:#FFFFFF;
    --warn:#96650F; --warn-soft:#F6EEDF; --warn-line:#E2CBA0;
    --good:#177D4E; --good-soft:#E8F2EC; --good-ink:#12643E; --good-line:#BFDDCB;
    --crit:#BE3A31; --crit-soft:#F7E4E2; --crit-line:#E7B8B3;
    --info:#2F55D4; --info-soft:#EEF0F5; --info-line:#D9DCE4;
    --amber:#96650F; --amber-soft:#F6EEDF;
    --shadow-1:0 1px 2px rgba(20,22,28,.05); --shadow-2:0 6px 22px rgba(20,22,28,.10);
    --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --serif:"IBM Plex Sans","Public Sans",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --nav-w:246px; --top-h:52px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#0E0F12; --surface:#17181C; --surface-2:#1E2024; --sunken:#141519;
      --ink:#ECEDEF; --ink-2:#B3B6BD; --ink-3:#82868F; --ink-4:#5C616B;
      --rule:#2A2C31; --rule-2:#3A3D44;
      --accent:#7396FF; --accent-ink:#9FB6FF; --accent-soft:#1F2129; --accent-line:#33363E; --on-accent:#0B0D12;
      --warn:#DCA23A; --warn-soft:#282010; --warn-line:#564526;
      --good:#3AC98A; --good-soft:#122720; --good-ink:#55DD9F; --good-line:#23543F;
      --crit:#E5695F; --crit-soft:#2E1717; --crit-line:#5A2A26;
      --info:#7396FF; --info-soft:#1F2129; --info-line:#33363E;
      --amber:#DCA23A; --amber-soft:#282010;
      --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 8px 30px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0E0F12; --surface:#17181C; --surface-2:#1E2024; --sunken:#141519;
    --ink:#ECEDEF; --ink-2:#B3B6BD; --ink-3:#82868F; --ink-4:#5C616B;
    --rule:#2A2C31; --rule-2:#3A3D44;
    --accent:#7396FF; --accent-ink:#9FB6FF; --accent-soft:#1F2129; --accent-line:#33363E; --on-accent:#0B0D12;
    --warn:#DCA23A; --warn-soft:#282010; --warn-line:#564526;
    --good:#3AC98A; --good-soft:#122720; --good-ink:#55DD9F; --good-line:#23543F;
    --crit:#E5695F; --crit-soft:#2E1717; --crit-line:#5A2A26;
    --info:#7396FF; --info-soft:#1F2129; --info-line:#33363E;
    --amber:#DCA23A; --amber-soft:#282010;
    --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 8px 30px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:var(--accent-ink);text-decoration:none}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
  input,select,textarea{font:inherit;color:inherit}
  ::selection{background:var(--accent);color:var(--on-accent)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .muted{color:var(--ink-3)}
  .tiny{font-size:11px}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
  .serif{font-family:var(--serif);font-weight:600;letter-spacing:-.01em}
  .row{display:flex;align-items:center;gap:10px}
  .row.wrap{flex-wrap:wrap}
  .col{display:flex;flex-direction:column;gap:10px}
  .between{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .spacer{flex:1}
  .grid{display:grid;gap:16px}
  .g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:1080px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:720px){.g2,.g3,.g4{grid-template-columns:1fr}}

  /* shell */
  .app{display:grid;grid-template-columns:var(--nav-w) 1fr;min-height:100vh;padding-right:var(--aiw,0px);transition:padding-right .16s ease}
  html.ai-dragging .app{transition:none}
  html.ai-dragging,html.ai-dragging *{cursor:ew-resize!important;user-select:none}
  .nav{background:var(--surface);border-right:1px solid var(--rule);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:9px;height:var(--top-h);padding:0 16px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--surface);z-index:2}
  .brand b{font-family:var(--serif);font-size:15px;font-weight:600}
  .navgroups{padding:8px 8px 24px;flex:1}
  .navgroup{margin-top:6px}
  .navgroup>.nav-h{width:100%;display:flex;align-items:center;justify-content:space-between;padding:7px 8px;color:var(--ink-3);font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase}
  .navgroup>.nav-h:hover{color:var(--ink)}
  .navgroup>.nav-h[aria-expanded]{border-radius:6px}
  .navgroup>.nav-h[aria-expanded]:hover{background:var(--sunken)}
  .navgroup>.nav-h[aria-expanded] svg{opacity:.6;transition:transform .15s}
  .navgroup>.nav-h[aria-expanded="true"] svg{transform:rotate(90deg)}
  .navitem{position:relative;width:100%;display:flex;align-items:center;justify-content:flex-start;gap:9px;padding:6px 8px 6px 10px;border-radius:6px;color:var(--ink-2);font-size:12.5px;font-family:var(--sans);text-transform:none;letter-spacing:0;text-align:left}
  .navitem:hover{background:var(--sunken);color:var(--ink)}
  .navitem.active{background:var(--surface-2);color:var(--ink);font-weight:600}
  .navitem.active::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;border-radius:2px;background:var(--accent)}
  .navitem .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.35;flex:none}
  .navitem.active .dot{opacity:1;background:var(--accent)}

  .main{display:flex;flex-direction:column;min-width:0}
  .top{height:var(--top-h);border-bottom:1px solid var(--rule);display:flex;flex-wrap:nowrap;align-items:center;gap:9px;padding:0 16px;background:var(--surface);position:sticky;top:0;z-index:5;overflow-x:auto;scrollbar-width:none}
  .top::-webkit-scrollbar{display:none}
  .top>*:not(.spacer){flex:none}
  .banner{background:var(--amber-soft);color:var(--amber);border-bottom:1px solid var(--rule);padding:5px 16px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;display:flex;gap:10px;align-items:center}
  .content{padding:28px 34px 100px;max-width:1200px;width:100%}
  @media(max-width:920px){.app{grid-template-columns:1fr;padding-right:0}.nav{display:none}}

  .field{display:flex;align-items:center;gap:7px;border:1px solid var(--rule-2);background:var(--surface);border-radius:7px;padding:5px 9px;font-size:12px}
  .field select,.field input{border:none;background:none;outline:none;width:100%}
  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule-2);background:var(--surface);border-radius:7px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap}
  .btn:hover{border-color:var(--ink-4)}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .btn.pri:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
  .btn.sm{padding:4px 8px;font-size:11px}
  .btn.ghost{border-color:transparent;background:var(--sunken)}
  .btn.on{border-color:var(--accent);color:var(--ink)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}

  .card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:18px}
  .card.pad0{padding:0;overflow:hidden}
  .card h3{margin:0 0 2px;font-size:13px}
  .cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--rule)}
  .cardhead h3{font-family:var(--serif);font-size:13.5px}

  .pagehead{margin-bottom:24px}
  .pagehead h1{font-family:var(--serif);font-size:22px;font-weight:600;margin:0 0 5px;letter-spacing:-.015em}
  .pagehead p{margin:0;color:var(--ink-3);max-width:78ch;line-height:1.6}
  .tabbar{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-bottom:16px;flex-wrap:wrap}
  .tab{padding:7px 12px;font-size:12px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--ink);border-color:var(--accent)}

  table.tbl{width:100%;border-collapse:collapse;font-size:12px}
  .tbl th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:400;padding:9px 12px;border-bottom:1px solid var(--rule);background:var(--surface-2);position:sticky;top:0}
  .tbl td{padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
  .tbl tr:last-child td{border-bottom:none}
  .tbl tr.clk{cursor:pointer}
  .tbl tr.clk:hover td{background:var(--sunken)}
  .tbl td.num,.tbl th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .scroll-x{overflow-x:auto}

  .pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:5px;border:1px solid var(--rule);color:var(--ink-3);background:var(--surface-2);white-space:nowrap}
  .pill.good{background:var(--good-soft);color:var(--good-ink);border-color:var(--good-line)}
  .pill.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
  .pill.crit{background:var(--crit-soft);color:var(--crit);border-color:var(--crit-line)}
  .pill.info{background:var(--info-soft);color:var(--info);border-color:var(--info-line)}
  .pill.mut{background:var(--sunken);border-color:var(--rule);color:var(--ink-3)}
  .rail{font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:2px 6px;border:1px solid var(--rule-2);color:var(--ink-2);border-radius:5px;background:var(--surface-2)}

  .stat{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:13px 14px}
  .stat .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
  .stat .v{font-size:21px;font-weight:600;letter-spacing:-.01em;margin-top:5px;font-variant-numeric:tabular-nums}
  .stat .d{font-size:11px;margin-top:3px;color:var(--ink-3)}
  .stat .d.up{color:var(--good-ink)} .stat .d.down{color:var(--warn)}

  .kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:12px}
  .kv dt{color:var(--ink-3)} .kv dd{margin:0}

  .drawer-wrap{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end}
  .drawer-bg{position:absolute;inset:0;background:rgba(10,16,15,.34)}
  .drawer{position:relative;width:min(520px,94vw);background:var(--surface);border-left:1px solid var(--rule);height:100%;overflow-y:auto;box-shadow:var(--shadow-2);animation:slide .18s ease}
  @keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
  .drawer-h{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--rule);padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;z-index:1}
  .drawer-b{padding:16px}
  .sect{margin-bottom:16px}
  .sect>.eyebrow{display:block;margin-bottom:7px}

  .dialog-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:64px 16px}
  .dialog-bg{position:absolute;inset:0;background:rgba(10,16,15,.4)}
  .dialog{position:relative;width:min(620px,96vw);background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow-2);max-height:80vh;overflow-y:auto}
  .dialog-h{padding:14px 16px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center}
  .dialog-b{padding:16px}

  .cmd{position:relative;width:min(600px,96vw);background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow-2);overflow:hidden}
  .cmd input{width:100%;border:none;outline:none;padding:14px 16px;font-size:14px;background:none;border-bottom:1px solid var(--rule)}
  .cmd-list{max-height:52vh;overflow-y:auto;padding:6px}
  .cmd-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;font-size:12.5px}
  .cmd-item.sel,.cmd-item:hover{background:var(--surface-2);color:var(--ink)}
  .cmd-item .hint{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-3)}

  .toasts{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:340px}
  .toast{background:var(--ink);color:var(--ground);border-radius:9px;padding:10px 13px;font-size:12px;box-shadow:var(--shadow-2);display:flex;gap:9px;align-items:flex-start}
  .toast .x{margin-left:auto;opacity:.6}

  .code{background:var(--sunken);border:1px solid var(--rule);border-radius:9px;padding:12px 13px;font-family:var(--mono);font-size:11.5px;line-height:1.6;overflow-x:auto;white-space:pre;color:var(--ink-2)}
  .seg{display:inline-flex;border:1px solid var(--rule-2);border-radius:8px;overflow:hidden}
  .seg button{padding:5px 10px;font-size:11px;font-weight:600;color:var(--ink-3);border-right:1px solid var(--rule)}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--ink);color:var(--surface)}
  .toggle{width:34px;height:20px;border-radius:20px;background:var(--rule-2);position:relative;flex:none;transition:background .15s}
  .toggle.on{background:var(--accent)}
  .toggle::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .15s}
  .toggle.on::after{left:16px}

  .listrow{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--rule)}
  .listrow:last-child{border-bottom:none}
  .listrow .ic{width:26px;height:26px;border-radius:7px;background:var(--sunken);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink-3)}
  .bar{height:7px;border-radius:4px;background:var(--sunken);overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--accent)}
  .divider{height:1px;background:var(--rule);margin:14px 0}
  .note{background:var(--surface-2);border:1px solid var(--rule);color:var(--ink-2);border-radius:9px;padding:11px 13px;font-size:12px;line-height:1.55}
  .note.warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
  ul.clean{margin:0;padding-left:18px} ul.clean li{margin:3px 0}

  /* ai assist — right-edge slider */
  .main-body{display:block;flex:1;min-height:0}
  .main-body>.content{min-width:0}
  .ai-fab{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:37;
    writing-mode:vertical-rl;display:flex;align-items:center;gap:8px;padding:14px 7px;
    border:1px solid var(--rule);border-right:none;border-radius:10px 0 0 10px;
    background:var(--surface);color:var(--ink-3);box-shadow:var(--shadow-1);
    font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;font-family:var(--mono)}
  .ai-fab:hover{border-color:var(--accent);color:var(--ink)}
  .ai-fab svg{transform:rotate(90deg)}
  .ai{position:fixed;top:var(--top-h);right:0;bottom:0;width:382px;z-index:38;
    background:var(--surface);border-left:1px solid var(--rule);box-shadow:var(--shadow-2);
    display:flex;flex-direction:column;transition:transform .22s ease,width .18s ease}
  html.ai-dragging .ai{transition:transform .22s ease}
  .ai.max{width:min(780px,94vw)}
  .ai.min{bottom:auto;height:auto;width:302px;border-bottom:1px solid var(--rule);border-radius:0 0 0 12px}
  .ai.hidden{transform:translateX(102%)}
  .ai-grip{position:absolute;left:0;top:0;bottom:0;width:10px;transform:translateX(-5px);cursor:ew-resize;z-index:3;touch-action:none}
  .ai-grip::after{content:"";position:absolute;left:4px;top:0;bottom:0;width:2px;background:transparent;transition:background .12s}
  .ai-grip:hover::after,html.ai-dragging .ai-grip::after{background:var(--accent)}
  .ai.min .ai-grip,.ai.hidden .ai-grip{display:none}
  .ai-h{padding:9px 10px 9px 13px;border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;gap:8px}
  .ai.min .ai-h{border-bottom:none;cursor:pointer}
  .ai-h b{font-family:var(--serif);font-size:13.5px}
  .ai-h .row{gap:7px}
  .ai-h-btns{display:flex;gap:1px}
  .ai-h-btns button{padding:5px;border-radius:6px;color:var(--ink-3);line-height:0}
  .ai-h-btns button:hover{background:var(--sunken);color:var(--ink)}
  .ai.min .ai-scroll,.ai.min .ai-in{display:none}
  .ai-scroll{flex:1;overflow-y:auto;padding:13px}
  .ai-msg{margin-bottom:10px;display:flex}
  .ai-msg.u{justify-content:flex-end}
  .ai-msg .b{display:inline-block;max-width:90%;padding:8px 11px;border-radius:10px;background:var(--sunken);font-size:12.5px;line-height:1.5}
  .ai-msg.u .b{background:var(--accent);color:var(--on-accent)}
  .ai.max .ai-msg .b{max-width:76%}
  .ai-chips{display:flex;flex-wrap:wrap;gap:6px}
  .ai-chip{border:1px solid var(--rule-2);border-radius:14px;padding:4px 9px;font-size:11px;color:var(--ink-2);text-align:left}
  .ai-chip:hover{border-color:var(--accent);color:var(--accent-ink)}
  .ai-task{border:1px solid var(--rule);border-radius:9px;padding:9px 10px;margin-bottom:7px}
  .ai-in{border-top:1px solid var(--rule);padding:9px;display:flex;gap:7px}
  .ai-in input{flex:1;border:1px solid var(--rule-2);border-radius:8px;padding:8px 10px;background:var(--surface);outline:none;font-size:12.5px}
  @media(max-width:640px){.ai,.ai.max{width:100vw}}

  /* notifications */
  .notif-btn{position:relative;padding:6px}
  .notif-dot{position:absolute;top:-4px;right:-4px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:var(--warn);color:#fff;font-size:9px;font-weight:700;font-family:var(--mono);display:flex;align-items:center;justify-content:center;line-height:1}
  .notif-scrim{position:fixed;inset:0;z-index:46}
  .notif-pop{position:fixed;right:14px;top:calc(var(--top-h) + 6px);width:330px;background:var(--surface);border:1px solid var(--rule);border-radius:11px;box-shadow:var(--shadow-2);z-index:47;overflow:hidden}
  .notif-row{display:flex;gap:10px;width:100%;text-align:left;padding:10px 12px;border-bottom:1px solid var(--rule);align-items:flex-start}
  .notif-row:hover{background:var(--sunken)}
  .notif-ic{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--sunken);color:var(--ink-3)}
  .notif-ic.warn{background:var(--warn-soft);color:var(--warn)}
  .notif-ic.info{background:var(--info-soft);color:var(--info)}
  .notif-ic.good{background:var(--good-soft);color:var(--good-ink)}
  .notif-t{font-size:12px;font-weight:600;display:block;line-height:1.35}
  .notif-all{width:100%;padding:9px;font-size:11.5px;font-weight:600;color:var(--accent-ink);background:var(--sunken)}
  .notif-all:hover{background:var(--accent-soft)}

  /* orchestration pipeline */
  .orc-pipe{display:flex;gap:3px;align-items:center;flex:none}
  .orc-seg{width:13px;height:6px;border-radius:3px;background:var(--rule-2)}
  .orc-seg.done{background:var(--accent-line)}
  .orc-seg.now{background:var(--accent)}

function auditEntry(actor, action, res){ return {id:uid("au"), actor, action, res, when:nowISO()}; }
function reducer(s, a){
  switch(a.type){
    case "persona": return {...s, persona:a.v};
    case "theme": return {...s, theme:a.v};
    case "env": return {...s, env:a.v};
    case "toast": return {...s, toasts:[...s.toasts, {id:uid("t"), msg:a.v}]};
    case "untoast": return {...s, toasts:s.toasts.filter(t=>t.id!==a.v)};
    case "openDecision": return {...s, openDecision:a.v};
    case "supplierView": return {...s, supplierView:a.v};
    case "cmd": return {...s, cmd:a.v};
    case "notif": return {...s, notif:a.v};
    case "ai": return {...s, aiOpen:a.v};
    case "aiSize": return {...s, aiOpen:true, aiSize:a.v};
    case "aiWidth": return {...s, aiWidth:a.v};
    case "install": return {...s, installed:[...new Set([...s.installed, a.v])], audit:[auditEntry("You","Installed "+a.name, a.v), ...s.audit], toasts:[...s.toasts,{id:uid("t"),msg:"Installed "+a.name}]};
    case "uninstall": return {...s, installed:s.installed.filter(x=>x!==a.v), audit:[auditEntry("You","Uninstalled "+a.name, a.v), ...s.audit], toasts:[...s.toasts,{id:uid("t"),msg:"Uninstalled "+a.name}]};
    case "addMandate": return {...s, mandates:[a.v, ...s.mandates], audit:[auditEntry("You","Created mandate "+a.v.id, a.v.agent), ...s.audit], toasts:[...s.toasts,{id:uid("t"),msg:"Mandate "+a.v.id+" created"}]};
    case "autonomy": return {...s, autonomy:{...s.autonomy, [a.id]:a.v}};
    case "mcpTool": return {...s, mcpTools:{...s.mcpTools, [a.id]:{...s.mcpTools[a.id], ...a.patch}}};
    case "mcpConnect": return {...s, mcpConnected:a.v, audit:[auditEntry("You", a.v?"Connected MCP client":"Disconnected MCP client","mcp"), ...s.audit]};
    case "revokeAgent": return {...s, agentStatus:{...s.agentStatus, [a.id]:"revoked"}, audit:[auditEntry("You","Revoked agent "+a.id,"agents"), ...s.audit], toasts:[...s.toasts,{id:uid("t"),msg:"Agent revoked — network token invalidated"}]};
    case "reverseDecision": return {...s, reversed:{...s.reversed, [a.id]:true}, audit:[auditEntry("You","Reversed decision "+a.id,"decisions"), ...s.audit], toasts:[...s.toasts,{id:uid("t"),msg:"Decision "+a.id+" reversed"}]};
    case "addWebhook": return {...s, webhooks:[a.v, ...s.webhooks], toasts:[...s.toasts,{id:uid("t"),msg:"Webhook endpoint added"}]};
    case "testEvent": return {...s, webhooks:s.webhooks.map(w=>w.id===a.id?{...w, last:"just now (test)"}:w), toasts:[...s.toasts,{id:uid("t"),msg:"Test event delivered"}]};
    case "addMember": return {...s, members:[a.v, ...s.members], audit:[auditEntry("You","Invited "+a.v.email, a.v.role), ...s.audit], toasts:[...s.toasts,{id:uid("t"),msg:"Invite sent to "+a.v.email}]};
    case "addApprovalRule": return {...s, approvalRules:[a.v, ...s.approvalRules], audit:[auditEntry("You","Added approval rule", a.v.when), ...s.audit], toasts:[...s.toasts,{id:uid("t"),msg:"Approval rule added"}]};
    case "revokeConsent": return {...s, consent:s.consent.map(c=>c.id===a.id?{...c, status:"revoked"}:c), audit:[auditEntry("You","Revoked consent "+a.id,"consent"), ...s.audit], toasts:[...s.toasts,{id:uid("t"),msg:"Consent revoked — underwriting input withdrawn"}]};
    case "sso": return {...s, ssoOn:a.v};
    case "scim": return {...s, scimOn:a.v, toasts:[...s.toasts,{id:uid("t"),msg:a.v?"SCIM enabled":"SCIM disabled"}]};
    case "rotateKey": return {...s, audit:[auditEntry("You","Rotated "+a.v,"dev-keys"), ...s.audit], toasts:[...s.toasts,{id:uid("t"),msg:a.v+" rotated"}]};
    default: return s;
  }
}

function Sparkline({data, w=180, h=40, tone="var(--accent)"}){
  const mn=Math.min(...data), mx=Math.max(...data), rng=(mx-mn)||1;
  const pts = data.map((d,i)=>`${(i/(data.length-1))*w},${h-((d-mn)/rng)*(h-6)-3}`).join(" ");
  return html`<svg viewBox=${`0 0 ${w} ${h}`} width=${w} height=${h} preserveAspectRatio="none" role="img" aria-label="trend">
    <polyline points=${pts} fill="none" stroke=${tone} stroke-width="1.6"/>
    <circle cx=${w} cy=${h-((data[data.length-1]-mn)/rng)*(h-6)-3} r="2.4" fill=${tone}/>
  </svg>`;
}
function StackBars({series, w=280, h=90, cols}){
  const C = cols || ["var(--accent)","var(--info)","var(--amber)","var(--ink-4)"];
  const bw = w/series.length - 8;
  return html`<svg viewBox=${`0 0 ${w} ${h}`} width="100%" height=${h} preserveAspectRatio="none" role="img" aria-label="stacked composition over time">
    ${series.map((col,i)=>{ let y=h; const x=i*(bw+8)+4;
      return col.map((v,j)=>{ const bh=(v/100)*(h-4); y-=bh; return html`<rect x=${x} y=${y} width=${bw} height=${bh} fill=${C[j]}/>`; });
    })}
  </svg>`;
}
function LineChart({data, w=560, h=150, unit="", tone="var(--accent)", fmt}){
  const P = {l:56,r:14,t:12,b:20}, iw = w-P.l-P.r, ih = h-P.t-P.b;
  const mn = Math.min(...data), mx = Math.max(...data), pad0 = (mx-mn)*0.18 || 1;
  const lo = mn-pad0, hi = mx+pad0, rng = hi-lo;
  const X = i => P.l + (i/(data.length-1))*iw;
  const Y = v => P.t + ih - ((v-lo)/rng)*ih;
  const line = data.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  const area = `${P.l},${(P.t+ih).toFixed(1)} ${line} ${(P.l+iw).toFixed(1)},${(P.t+ih).toFixed(1)}`;
  const rnd = t => rng>=8 ? Math.round(t) : Math.round(t*10)/10;
  const ticks = [rnd(lo+rng*0.12), rnd((lo+hi)/2), rnd(hi-rng*0.12)];
  const lab = v => (fmt?fmt(v):v)+unit;
  return html`<svg viewBox=${`0 0 ${w} ${h}`} width="100%" height=${h} role="img" aria-label="line chart">
    ${ticks.map(t=>html`<line x1=${P.l} x2=${P.l+iw} y1=${Y(t)} y2=${Y(t)} stroke="var(--rule)" stroke-width="1"/>`)}
    ${ticks.map(t=>html`<text x=${P.l-8} y=${Y(t)+3} text-anchor="end" font-family="var(--mono)" font-size="9" fill="var(--ink-3)">${lab(t)}</text>`)}
    <polygon points=${area} fill=${tone} opacity="0.09"/>
    <polyline points=${line} fill="none" stroke=${tone} stroke-width="1.9"/>
    <circle cx=${X(data.length-1)} cy=${Y(data[data.length-1])} r="3.2" fill=${tone}/>
    <text x=${P.l} y=${h-5} font-family="var(--mono)" font-size="9" fill="var(--ink-4)">−12 periods</text>
    <text x=${P.l+iw} y=${h-5} text-anchor="end" font-family="var(--mono)" font-size="9" fill="var(--ink-4)">now</text>
  </svg>`;
}

function PoliciesPanel(){
  const { dispatch } = useStore();
  const [sel, setSel] = useState(POLICIES[0].id);
  const p = POLICIES.find(x=>x.id===sel);
  const [rules, setRules] = useState(p.rules);
  const [dirty, setDirty] = useState(false);
  const [edit, setEdit] = useState(null); // index, or "new"
  const [form, setForm] = useState({w:"", t:"", stop:false});
  useEffect(()=>{ setRules(p.rules); setDirty(false); setEdit(null); },[sel]);
  const openEdit = i => { setEdit(i); setForm(i==="new" ? {w:"",t:"",stop:false} : {...rules[i]}); };
  const saveEdit = () => {
    if(!form.w.trim() || !form.t.trim()) return;
    const next = edit==="new" ? [...rules, {...form}] : rules.map((r,i)=> i===edit ? {...form} : r);
    setRules(next); setDirty(true); setEdit(null);
    dispatch({type:"toast", v: edit==="new" ? "Rule added to the draft" : "Rule R"+(edit+1)+" updated in the draft"});
  };
  const move = (i, d) => { const j=i+d; if(j<0||j>=rules.length) return; const n=rules.slice(); [n[i],n[j]]=[n[j],n[i]]; setRules(n); setDirty(true); };
  const del = i => { setRules(rules.filter((_,x)=>x!==i)); setDirty(true); };
  const activate = () => { setDirty(false); dispatch({type:"toast", v:p.name+" v"+(p.ver+1)+" activated"}); };
  const discard = () => { setRules(p.rules); setDirty(false); setEdit(null); };
  return html`<div class="col" style="gap:16px">
    <p style="color:var(--ink-3);max-width:78ch;margin:0">Decision tables as first-class, versioned objects. Each is an <b>ordered list of rules</b>, evaluated top to bottom for every payment (also via the API and the MCP server). Change a rule, simulate it against historical volume, then activate a new version.</p>
    <div class="grid g3">
      ${POLICIES.map(x=>html`<button class="card" style=${"text-align:left"+(sel===x.id?";border-color:var(--accent)":"")} onClick=${()=>setSel(x.id)}>
        <div class="between"><b>${x.name}</b><span class="pill mut">v${x.ver}</span></div>
        <div class="tiny muted" style="margin-top:6px">${x.rules.length} rules · updated ${x.updated} by ${x.by}</div>
      </button>`)}
    </div>

    <div class="card">
      <div class="between" style="flex-wrap:wrap;gap:8px">
        <div><h3 class="serif">${p.name} · v${p.ver}${dirty?html` <span class="pill warn" style="margin-left:6px">draft</span>`:null}</h3>
          <div class="tiny muted" style="margin-top:3px">${p.note} · last activated ${p.updated} by ${p.by} · called on every payment</div></div>
        <div class="row" style="gap:7px">
          <button class="btn sm" onClick=${()=>navigate("/simulator")}>Simulate</button>
          <button class="btn sm pri" onClick=${()=>openEdit("new")}>Add rule</button>
        </div>
      </div>

      <div class="tiny muted" style="margin:12px 0 8px">Evaluated in order. A rule marked <b>stop</b> resolves the outcome and evaluation ends; the others narrow the option set and fall through to the next.</div>
      <div class="card pad0 scroll-x"><table class="tbl">
        <thead><tr><th style="width:1%">#</th><th>When</th><th>Then</th><th style="width:1%">Stop</th><th style="width:1%"></th></tr></thead>
        <tbody>${rules.map((r,i)=>html`<tr>
          <td class="mono">R${i+1}</td>
          <td class="tiny">${r.w}</td>
          <td class="tiny" style="color:var(--ink-2)">${r.t}</td>
          <td>${r.stop?html`<${Pill} tone="mut">stop</${Pill}>`:html`<span class="tiny muted">fall-through</span>`}</td>
          <td><div class="row" style="gap:2px;flex:none">
            <button class="btn sm ghost" title="Move up" onClick=${()=>move(i,-1)} disabled=${i===0}><span style="display:inline-flex;transform:rotate(-90deg)"><${Icon} n="chev" s=11/></span></button>
            <button class="btn sm ghost" title="Move down" onClick=${()=>move(i,1)} disabled=${i===rules.length-1}><span style="display:inline-flex;transform:rotate(90deg)"><${Icon} n="chev" s=11/></span></button>
            <button class="btn sm ghost" onClick=${()=>openEdit(i)}>Edit</button>
            <button class="btn sm ghost" title="Delete rule" onClick=${()=>del(i)}><${Icon} n="x" s=11/></button>
          </div></td>
        </tr>`)}</tbody>
      </table></div>

      ${edit!==null && html`<div class="card" style="margin-top:12px;border-color:var(--accent-line)">
        <div class="eyebrow" style="margin-bottom:8px">${edit==="new"?"New rule":"Edit rule R"+(edit+1)}</div>
        <label class="tiny muted">When (condition)</label>
        <input class="field" style="width:100%;margin-bottom:8px" value=${form.w} onInput=${e=>setForm({...form,w:e.target.value})} placeholder="e.g. Amount ≥ $100,000"/>
        <label class="tiny muted">Then (action)</label>
        <input class="field" style="width:100%;margin-bottom:8px" value=${form.t} onInput=${e=>setForm({...form,t:e.target.value})} placeholder="e.g. Require dual approval"/>
        <label class="row tiny" style="gap:6px"><input type="checkbox" checked=${form.stop} onChange=${e=>setForm({...form,stop:e.target.checked})}/> Stop on match (resolves the outcome)</label>
        <div class="row" style="gap:7px;margin-top:10px">
          <button class="btn sm pri" onClick=${saveEdit}>${edit==="new"?"Add to draft":"Save to draft"}</button>
          <button class="btn sm ghost" onClick=${()=>setEdit(null)}>Cancel</button>
        </div>
      </div>`}

      ${dirty && html`<div class="note" style="margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
        <span>Draft not yet live — ${rules.length} rules. Simulate the change, then activate a new version.</span>
        <div class="row" style="gap:7px;flex:none">
          <button class="btn sm" onClick=${()=>navigate("/simulator")}>Simulate</button>
          <button class="btn sm pri" onClick=${activate}>Activate v${p.ver+1}</button>
          <button class="btn sm ghost" onClick=${discard}>Discard</button>
        </div>
      </div>`}

      <div class="tiny muted" style="margin-top:12px">Version history: v${p.ver} (active) ← v${p.ver-1} ← v${p.ver-2}. Every version keeps its author, activation date, diff and a one-click rollback. To see which rules fired for a specific payment, open that payment's decision → <b>Policy rules evaluated</b>.</div>
    </div>
  </div>`;
}

function paymentActivity(p){
  const r = railName(p.rail), fund = PAY_FUND[p.fund]||p.fund;
  const t0 = new Date(p.when), at = m => new Date(t0.getTime()+m*60000).toISOString();
  const a = [
    {w:"System", ev:"Payment intent created — pay "+p.sup+" "+money(p.amt), when:at(-8)},
    {w:"Decision engine", ev:"Decision recorded — "+r+" from "+fund+(p.dec?" · "+p.dec:""), when:at(-6)}
  ];
  if(p.status==="held") a.push({w:"Risk controls", ev:"Held — supplier bank details changed within 30 days; out-of-band verification pending", when:at(-3)});
  else if(p.status==="scheduled") a.push({w:"System", ev:"Scheduled for "+day(p.when)+" — kept above the liquidity buffer until the due date", when:at(-3)});
  else {
    a.push({w:"Execution", ev:"Payment executed on "+r, when:at(0)});
    a.push({w:"System", ev:"Remittance advice sent to "+p.sup+" — ISO 20022, line-item detail", when:at(4)});
    if(p.status==="received"||p.status==="reconciled") a.push({w:p.sup, ev:"Confirmed funds received", when:at(90)});
    if(p.status==="reconciled") a.push({w:"Close Agent", ev:"Reconciled — invoice ↔ bank ↔ settlement tie out · variance $0.00", when:at(220)});

}

function ReconChainDiag(){

  const consentActive = (state.consent.find(c=>c.id==="cg1")||{}).status === "active";
  const inputs = [
    ["Observed revenue (settled inflows)", "consented"],
    ["Buyer concentration & payment reliability", "consented"],
    ["Seasonality across observed cycles", "always"],
    ["Receivables in flight", "consented"],
    ["Refunds & disputes signal", "consented"],
    ["Own supplier-payment punctuality", "always"]
  ];
  return html`<div>
    <p style="color:var(--ink-3);max-width:74ch;margin:0 0 14px">Which first-party signals feed the credit model. Consented inputs are withdrawn the moment their grant is revoked in Admin › Data governance — the data advantage lasts only as long as the customer keeps granting it.</p>
    <${Table} cols=${[
      {label:"Signal", render:r=>r[0]},
      {label:"Basis", render:r=>r[1]==="always"?html`<${Pill} tone="mut">no consent needed</${Pill}>`:html`<${Pill} tone="info">underwriting consent</${Pill}>`},
      {label:"Status", render:r=>(r[1]==="always"||consentActive)?html`<${Pill} tone="good">feeding model</${Pill}>`:html`<${Pill} tone="crit">withdrawn</${Pill}>`}
    ]} rows=${inputs}/>
    ${!consentActive && html`<div class="note warn" style="margin-top:14px">Underwriting consent (cg1) is revoked. Four signals are withdrawn; the working-capital credit model falls back to a thinner input set and offers are suppressed.</div>`}
  </div>`;
}
function hubScreen(title, sub, panels){
  return function(){
    const cur = useRoute();
    const act = panels.find(p=>p.route===cur) || panels[0];
    const shown = panels.filter(p=>!p.hidden || p.route===act.route);
    return html`<${Page} title=${title} sub=${sub}>
      <${Tabs} tabs=${shown.map(p=>({id:p.route,label:p.label}))} value=${act.route} onChange=${r=>navigate(r)}/>
      <${act.comp}/>
    </${Page}>`;
  };
}

/* ============================ APP ============================ */
function ThemeSync(){
  const { state } = useStore();
  useEffect(()=>{
    const root = document.documentElement;
    if(state.theme==="system") root.removeAttribute("data-theme");
    else root.setAttribute("data-theme", state.theme);
  },[state.theme]);
  return null;
}
function App(){
  const [state, dispatch] = useReducer(reducer, initial);
  useEffect(()=>{ saveLS({persona:state.persona, theme:state.theme, env:state.env, installed:state.installed, autonomy:state.autonomy, mcpTools:state.mcpTools, mcpConnected:state.mcpConnected, ssoOn:state.ssoOn, scimOn:state.scimOn, aiOpen:state.aiOpen, aiSize:state.aiSize, aiWidth:state.aiWidth}); },
    [state.persona,state.theme,state.env,state.installed,state.autonomy,state.mcpTools,state.mcpConnected,state.ssoOn,state.scimOn,state.aiOpen,state.aiSize,state.aiWidth]);
  return html`<${Store.Provider} value=${{state, dispatch}}>
    <${ThemeSync}/>
    ${typeof Shell==="function" ? html`<${Shell}/>` : html`<div style="padding:40px;font-family:var(--mono)">Loading PaymentOS…</div>`}
  <//>`;
}
render(html`<${App}/>`, document.getElementById("root"));
})();
</script>
